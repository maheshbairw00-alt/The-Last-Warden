<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Last Warden</title>
<link rel="stylesheet" href="style.css?v=5">
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.2.0/dist/model-viewer.min.js"></script>
</head>
<body>
<button type="button" id="start">शुरू करने के लिए टैप करें</button>
<button type="button" id="mute">🔊 म्यूज़िक</button>
<audio id="music" src="music.wav" loop preload="auto"></audio>
<div id="rotate">📱 फ़ोन को आड़ा करें</div>
<main>
  <h1 class="logo">The Last Warden</h1>
  <section id="loading">
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="fill"></div></div>
    <p id="percent">Loading... 0%</p>
    <p class="tip">रात होने से पहले आग जला लो।</p>
  </section>
  <section id="login" hidden>
    <button type="button" data-provider="google">Gmail से लॉगिन</button>
    <button type="button" data-provider="facebook">Facebook से लॉगिन</button>
    <button type="button" data-provider="guest">Guest के रूप में खेलें</button>
    <p id="status" aria-live="polite"></p>
  </section>
</main>
<div id="lobby" hidden>
  <div class="profile" id="player">Player</div>
  <h2>The Last Warden</h2>
  <model-viewer id="hero" src="character.glb" alt="Viking योद्धा का 3D करेक्टर" loading="eager" camera-controls disable-zoom disable-pan disable-tap interaction-prompt="none" camera-orbit="0deg 85deg 105%" min-camera-orbit="auto 85deg auto" max-camera-orbit="auto 85deg auto" environment-image="neutral" exposure="1.6" shadow-intensity="1" touch-action="none"></model-viewer>
  <p id="hero-status" aria-live="polite">करेक्टर लोड हो रहा है...</p>
  <p id="credit"><a href="https://sketchfab.com/search?q=Viking+Medieval+Game+Character+CGenesis&amp;type=models" target="_blank" rel="noopener">Viking/Medieval Game Character</a> by CGenesis, <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener">CC BY 4.0</a>. Textures compressed.</p>
  <nav>
    <button type="button" data-menu="Inventory">Inventory</button>
    <button type="button" data-menu="Friends">Friends</button>
    <button type="button" data-menu="Shop">Shop</button>
    <button type="button" data-menu="Settings">Settings</button>
  </nav>
  <button type="button" id="play">PLAY</button>
  <p id="note" aria-live="polite"></p>
</div>
<script src="login.js"></script>
<script src="lobby.js?v=5"></script>
<script src="app.js"></script>
<script src="loading.js"></script>
</body>
</html>
